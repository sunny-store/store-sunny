<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Impor data Sunny Store</title>
<style>
:root{--bg:#fff8ee;--pk:#ffd3e1;--pk2:#e8699a;--tx:#4a2036}
@media(prefers-color-scheme:dark){:root{--bg:#2a1a22;--pk:#4a2a38;--pk2:#ff8fb8;--tx:#ffeaf2}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;padding:16px}
.w{max-width:620px;margin:0 auto}h1{font-size:22px;margin:4px 0}.card{background:#fff8;border:2px solid var(--pk);border-radius:18px;padding:14px;margin:12px 0}
label{display:block;font-weight:600;margin:10px 0 4px}input[type=password],input[type=file]{width:100%;padding:10px;border:2px solid var(--pk);border-radius:12px;background:transparent;color:inherit;font:inherit}
button{border:0;background:var(--pk2);color:#fff;font:700 15px inherit;padding:12px 16px;border-radius:14px;cursor:pointer;width:100%;margin-top:12px}button:disabled{opacity:.5}
small{opacity:.8}.ok{color:#2f7a37}.er{color:#b3261e}pre{white-space:pre-wrap;background:#0002;padding:10px;border-radius:12px;font-size:13px}
</style></head><body><div class="w">
<h1>☀️ Impor data Sunny Store</h1>
<p><small>Halaman sekali pakai untuk memindahkan data dari website lama. Aman dijalankan berulang: data yang sudah ada dilewati. Setelah selesai, kamu boleh menghapus file <code>public/impor.html</code>.</small></p>
<div class="card"><b>1. Masuk admin</b>
<label for="pw">Password admin</label><input id="pw" type="password" autocomplete="current-password">
<button id="bl">Masuk</button><div id="ls"></div></div>
<div class="card" id="st" style="display:none"><b>2. Pilih file</b>
<label>Konfigurasi toko (config.json dari website lama)</label><input id="fc" type="file" accept=".json,application/json"><small id="ic"></small>
<label>Rekap penjualan (rekap-sunny-….csv)</label><input id="fo" type="file" accept=".csv"><small id="io"></small>
<label>Langganan (langganan-sunny.csv)</label><input id="fs" type="file" accept=".csv"><small id="is"></small>
<label>Pengeluaran (pengeluaran-sunny-….csv)</label><input id="fe" type="file" accept=".csv"><small id="ie"></small>
<button id="go" disabled>Impor sekarang</button><pre id="log" style="display:none"></pre></div>
<script>
const $=s=>document.querySelector(s);let TOKEN='';const F={};
function parseCSV(t){t=String(t).replace(/^\uFEFF/,'');const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x!==''))rows.push(r);r=[]}else c+=ch}
 if(c!==''||r.length){r.push(c);if(r.some(x=>x!==''))rows.push(r)}
 const h=(rows.shift()||[]).map(x=>x.trim());return rows.map(a=>Object.fromEntries(h.map((k,i)=>[k,a[i]??''])))}
async function api(path,method,body){const r=await fetch(path,{method,headers:{'content-type':'application/json',authorization:'Bearer '+TOKEN},body:typeof body==='string'?body:JSON.stringify(body)});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||('Gagal ('+r.status+')'));return j}
$('#bl').onclick=async()=>{$('#ls').textContent='Memeriksa…';try{const j=await api('/api/login','POST',{password:$('#pw').value});TOKEN=j.token;$('#ls').innerHTML='<span class="ok">Berhasil masuk ✓</span>';$('#st').style.display=''}catch(e){$('#ls').innerHTML='<span class="er"></span>';$('#ls').firstChild.textContent=e.message}};
function bind(id,key,info,kind){$(id).onchange=async e=>{const f=e.target.files[0];F[key]=null;if(f){const t=await f.text();if(kind==='json'){try{const d=JSON.parse(t);if(!d.shop||!Array.isArray(d.products))throw 0;F[key]=t;$(info).textContent='Terbaca: '+d.products.length+' produk'}catch(x){$(info).textContent='File bukan konfigurasi toko yang valid'}}else{const r=parseCSV(t);F[key]=r;$(info).textContent=r.length+' baris terbaca'}}$('#go').disabled=!(F.c||F.o||F.s||F.e)}}
bind('#fc','c','#ic','json');bind('#fo','o','#io');bind('#fs','s','#is');bind('#fe','e','#ie');
const L=m=>{const l=$('#log');l.style.display='';l.textContent+=m+'\n'};
async function bulk(kind,rows,label,groupKey){let add=0,skip=0,bad=0;const g=new Map();rows.forEach((r,i)=>{const k=groupKey?r[groupKey]:i;(g.get(k)||g.set(k,[]).get(k)).push(r)});const gs=[...g.values()];
 for(let i=0;i<gs.length;i+=40){const part=gs.slice(i,i+40).flat();const j=await api('/api/import','POST',{kind,rows:part});add+=j.added;skip+=j.skipped;bad+=j.bad}
 L(label+': '+add+' ditambahkan, '+skip+' sudah ada (dilewati), '+bad+' dilewati karena tidak valid')}
$('#go').onclick=async()=>{$('#go').disabled=true;$('#log').textContent='';try{
 if(F.c){await api('/api/config','PUT',F.c);L('Konfigurasi toko: tersimpan ✓')}
 if(F.o)await bulk('orders',F.o,'Rekap penjualan','No. Pesanan');
 if(F.s)await bulk('subs',F.s,'Langganan');
 if(F.e)await bulk('expenses',F.e,'Pengeluaran');
 L('\nSelesai. Buka halaman utama → login admin → ✎ Edit → Buka Rekap Bulanan untuk mengecek.')}catch(e){L('\nBerhenti: '+e.message+'\nKamu bisa menekan Impor lagi, data yang sudah masuk tidak akan dobel.')}$('#go').disabled=false};
</script></div></body></html>
